name: Upload AAB/APK to Google Drive

on:
  workflow_call:
    secrets:
      GOOGLE_DRIVE_FOLDER_ID:
        required: true
      GOOGLE_DRIVE_SERVICE_ACCOUNT:
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: aab

      - name: Debug - List workspace files
        run: |
          echo "=== Workspace root ==="
          ls -la
          echo "=== build directory (if exists) ==="
          ls -la build/ 2>/dev/null || echo "build/ not found"
          find . -name "app-release*" -type f 2>/dev/null || echo "No app-release files found"

      - name: Setup rclone
        run: |
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Validate Google Drive Secret
        run: |
          if [ -z "${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}" ]; then
            echo "❌ ERROR: GOOGLE_DRIVE_SERVICE_ACCOUNT secret is not set"
            exit 1
          fi
          echo "✅ Google Drive secret validated"

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}" > /tmp/sa.json

          # Validate JSON format
          if ! python3 -m json.tool /tmp/sa.json > /dev/null 2>&1; then
            echo "❌ ERROR: Invalid JSON in GOOGLE_DRIVE_SERVICE_ACCOUNT secret"
            rm -f /tmp/sa.json
            exit 1
          fi

          rclone config create gdrive drive \
            service_account_file /tmp/sa.json

      - name: Upload AAB
        continue-on-error: true
        run: |
          if [ -f "app-release.aab" ]; then
            rclone copy app-release.aab \
              gdrive:${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}/
            echo "✅ AAB uploaded"
          else
            echo "⚠️ AAB file not found"
          fi

      - name: Upload APK
        continue-on-error: true
        run: |
          if [ -f "app-release.apk" ]; then
            rclone copy app-release.apk \
              gdrive:${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}/
            echo "✅ APK uploaded"
          else
            echo "⚠️ APK file not found"
          fi

      - name: Cleanup
        run: |
          rm -f /tmp/sa.json
