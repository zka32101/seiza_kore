name: Build and Deploy APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Setup Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            GRADLE_VERSION=$(sed -n 's|.*/gradle-\(.*\)-all\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)
            TMP=$(mktemp -d)
            touch "$TMP/settings.gradle"
            (cd "$TMP" && gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type all -q)
            cp "$TMP/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
            rm -rf "$TMP"
          fi

      - name: Setup Flutter SDK path
        working-directory: android
        run: echo "flutter.sdk=$FLUTTER_HOME" > local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/apk/release/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: build/app/outputs/bundle/release/app-release.aab

  upload-to-google-drive:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: aab

      - name: Setup rclone
        run: |
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Validate Google Drive Secret
        run: |
          if [ -z "${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}" ]; then
            echo "❌ ERROR: GOOGLE_DRIVE_SERVICE_ACCOUNT secret is not set"
            echo "Please configure this secret in repository settings with valid service account JSON"
            exit 1
          fi
          echo "✅ Google Drive secret validated"

      - name: Configure rclone
        run: |
          set -e
          mkdir -p ~/.config/rclone
          echo "${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}" > /tmp/sa.json

          # Validate JSON format
          if ! python3 -m json.tool /tmp/sa.json > /dev/null 2>&1; then
            echo "❌ ERROR: Invalid JSON in GOOGLE_DRIVE_SERVICE_ACCOUNT secret"
            rm -f /tmp/sa.json
            exit 1
          fi

          rclone config create gdrive drive \
            service_account_file /tmp/sa.json
          echo "✅ rclone configured"

      - name: Upload AAB to Google Drive
        run: |
          set -e
          if [ ! -f "app-release.aab" ]; then
            echo "❌ ERROR: AAB file not found"
            exit 1
          fi

          echo "📤 Uploading AAB to Google Drive..."
          rclone -v copy app-release.aab \
            gdrive:${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}/ || {
            echo "❌ AAB upload failed"
            exit 1
          }

          echo "✅ AAB successfully uploaded"

      - name: Upload APK to Google Drive
        run: |
          set -e
          if [ ! -f "app-release.apk" ]; then
            echo "❌ ERROR: APK file not found"
            exit 1
          fi

          echo "📤 Uploading APK to Google Drive..."
          rclone -v copy app-release.apk \
            gdrive:${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}/ || {
            echo "❌ APK upload failed"
            exit 1
          }

          echo "✅ APK successfully uploaded"
      - name: Cleanup
        run: |
          rm -f /tmp/sa.json
